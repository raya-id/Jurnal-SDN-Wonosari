<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>JURNAL HARIAN GURU</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Jurnal Guru" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0ea5e9" />
  
  <!-- Panggil file relatif di GitHub -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./Jiraya-Free-Ox192.png" />
  <link rel="apple-touch-icon" href="./Jiraya-Free-Ox192.png" />

  <style>
    html, body { 
      margin: 0; padding: 0; width: 100%; height: 100%; 
      background-color: #f0f2f5; overflow: hidden; 
      font-family: system-ui, -apple-system, sans-serif; 
    }
    
    .iframe-container { 
      width: 100%; height: 100dvh; 
      overflow: hidden; position: relative; 
    }
    
    /* TEKNIK IFRAME CLIPPING & GPU ACCELERATION */
    
    #loader { 
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
      background: #f0f2f5; display: flex; flex-direction: column; 
      align-items: center; justify-content: center; z-index: 20; 
      transition: opacity 0.5s ease;
    }
    
    /* ANIMASI LOADING BIRU - MERAH */
    .spinner { 
      border: 4px solid #0ea5e9; /* Warna Dasar Biru */
      border-top: 4px solid #dc2626; /* Warna Putaran Merah */
      border-radius: 50%; width: 45px; height: 45px; 
      animation: spin 1s linear infinite; 
    }
    
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="iframe-container">
    <div id="loader">
      <div class="spinner"></div>
      <p style="color:#64748b; margin-top:16px; font-size:14px; font-weight:600;">Memuat Sistem Jurnal...</p>
    </div>
    <iframe
      id="app"
      src="https://script.google.com/macros/s/AKfycbz6vYhKoL2L-w8VarELqD-ek28OD3CBBf-KeN6j6EFQNok2H05f1gZBIUN_4PoAZClJ4A/exec"
      scrolling="yes"
      allow="camera; microphone; fullscreen; display-capture">
    </iframe>
  </div>

  <script>
    // Transisi Loader
    const iframe = document.getElementById('app');
    iframe.addEventListener('load', function() {
      setTimeout(() => { 
        const loader = document.getElementById('loader');
        loader.style.opacity = '0';
        setTimeout(() => loader.style.display = 'none', 500); 
      }, 500);
    });

    // Registrasi Service Worker PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(error => {
          console.error('Pendaftaran ServiceWorker gagal:', error);
        });
      });
    }
  </script>
</body>
</html>
